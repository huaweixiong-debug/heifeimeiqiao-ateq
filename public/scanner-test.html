<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码枪测试页面</title>
<script src="/appearance.js"></script>
<link rel="stylesheet" href="/appearance.css">
<style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2a3a50;
      --text: #e6edf3;
      --muted: #8b9bb5;
      --accent: #58a6ff;
      --good: #3fb950;
      --bad: #f85149;
      --warning: #d29922;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    /* ===== 顶部 ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, var(--panel), #1e2d44);
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .header .sub {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      border: 1px solid transparent;
    }

    .status-badge .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }

    .status-badge.online {
      background: rgba(63, 185, 80, 0.12);
      border-color: rgba(63, 185, 80, 0.3);
      color: var(--good);
    }
    .status-badge.online .dot { background: var(--good); box-shadow: 0 0 6px var(--good); }

    .status-badge.offline {
      background: rgba(248, 81, 73, 0.12);
      border-color: rgba(248, 81, 73, 0.3);
      color: var(--bad);
    }
    .status-badge.offline .dot { background: var(--bad); }

    .status-badge.connecting {
      background: rgba(210, 153, 34, 0.12);
      border-color: rgba(210, 153, 34, 0.3);
      color: var(--warning);
    }
    .status-badge.connecting .dot { background: var(--warning); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* ===== 配置面板 ===== */
    .config-panel {
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .config-panel h2 {
      margin: 0 0 16px;
      font-size: 16px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .field select,
    .field input {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: "Consolas", "Courier New", monospace;
    }

    .field select:focus,
    .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
    }

    .field select option {
      background: var(--bg);
    }

    .config-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) {
      background: #4090e8;
    }

    .btn-danger {
      background: var(--bad);
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) {
      background: #d93a33;
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover:not(:disabled) {
      background: rgba(255,255,255,0.06);
    }

    .btn-success {
      background: var(--good);
      color: #fff;
    }
    .btn-success:hover:not(:disabled) {
      background: #32a546;
    }

    .config-hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.5;
    }

    .config-hint code {
      background: rgba(255,255,255,0.06);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: "Consolas", "Courier New", monospace;
    }

    /* ===== 扫码结果 ===== */
    .scan-area {
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .scan-area h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--accent);
    }

    .scan-display {
      min-height: 100px;
      padding: 20px;
      border-radius: 10px;
      background: var(--bg);
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: border-color 0.3s;
    }

    .scan-display.has-data {
      border-color: var(--good);
      border-style: solid;
    }

    .scan-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .scan-text {
      font-size: 32px;
      font-weight: 700;
      word-break: break-all;
      text-align: center;
      line-height: 1.4;
      color: var(--good);
    }

    .scan-time {
      font-size: 13px;
      color: var(--muted);
    }

    .scan-empty {
      color: var(--muted);
      font-size: 15px;
    }

    .scan-counter {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
      text-align: center;
    }

    .scan-history {
      margin-top: 16px;
    }

    .scan-history h3 {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 8px;
      font-weight: 500;
    }

    .scan-history-list {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scan-history-list::-webkit-scrollbar {
      width: 6px;
    }
    .scan-history-list::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      border-radius: 6px;
      background: var(--bg);
      font-size: 13px;
      gap: 10px;
    }

    .history-item .h-text {
      font-family: "Consolas", "Courier New", monospace;
      word-break: break-all;
      flex: 1;
    }

    .history-item .h-time {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    /* ===== 调试信息 ===== */
    .debug-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .debug-panel {
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
    }

    .debug-panel h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .debug-panel pre {
      margin: 0;
      padding: 12px;
      border-radius: 8px;
      background: var(--bg);
      color: #c9d1d9;
      font-size: 11px;
      line-height: 1.5;
      max-height: 260px;
      overflow: auto;
      font-family: "Consolas", "Courier New", monospace;
    }

    .debug-panel pre::-webkit-scrollbar {
      width: 5px;
    }
    .debug-panel pre::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat-item {
      padding: 10px;
      border-radius: 8px;
      background: var(--bg);
    }

    .stat-item .s-label {
      font-size: 11px;
      color: var(--muted);
    }

    .stat-item .s-value {
      font-size: 18px;
      font-weight: 700;
      font-family: "Consolas", "Courier New", monospace;
    }

    .stat-item .s-unit {
      font-size: 11px;
      color: var(--muted);
      margin-left: 4px;
    }

    /* ===== DTR 控制 ===== */
    .signal-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .signal-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }

    .signal-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.08);
    }

    .signal-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .signal-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ===== 响应式 ===== */
    @media (max-width: 700px) {
      .debug-section {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .config-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .scan-text {
        font-size: 24px;
      }
    }

    @media (max-width: 450px) {
      .config-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="/license-ui.js"></script>
</head>
<body>
  <div class="page">

    <!-- ===== 顶栏 ===== -->
    <div class="header">
      <div>
        <h1>🔍 扫码枪测试</h1>
        <div class="sub">串口扫码枪调试工具 — 配置连接后扫码，实时查看原始数据</div>
      </div>
      <div id="status-badge" class="status-badge offline">
        <span class="dot"></span>
        <span id="status-text">服务离线</span>
      </div>
    </div>

    <div id="err-msg" style="display:none; padding:10px 16px; margin-bottom:16px; border-radius:8px; background:rgba(248,81,73,0.12); border:1px solid rgba(248,81,73,0.3); color:#f85149; font-size:13px; line-height:1.6;"></div>

    <!-- ===== 配置面板 ===== -->
    <div class="config-panel">
      <h2>⚙️ 串口配置</h2>
      <div class="config-grid">
        <div class="field">
          <label>COM 端口</label>
          <select id="com-port">
            <option value="COM1" selected>COM1</option>
            <option value="COM2">COM2</option>
            <option value="COM3">COM3</option>
            <option value="COM4">COM4</option>
            <option value="COM5">COM5</option>
            <option value="COM6">COM6</option>
            <option value="COM7">COM7</option>
            <option value="COM8">COM8</option>
            <option value="COM9">COM9</option>
            <option value="COM10">COM10</option>
          </select>
        </div>
        <div class="field">
          <label>波特率</label>
          <select id="baudrate">
            <option value="9600">9600</option>
            <option value="19200">19200</option>
            <option value="38400">38400</option>
            <option value="57600">57600</option>
            <option value="115200" selected>115200</option>
            <option value="230400">230400</option>
            <option value="460800">460800</option>
            <option value="921600">921600</option>
          </select>
        </div>
        <div class="field">
          <label>数据位</label>
          <select id="data-bits">
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8" selected>8</option>
          </select>
        </div>
        <div class="field">
          <label>停止位</label>
          <select id="stop-bits">
            <option value="1" selected>1</option>
            <option value="1.5">1.5</option>
            <option value="2">2</option>
          </select>
        </div>
        <div class="field">
          <label>校验位</label>
          <select id="parity">
            <option value="none" selected>None</option>
            <option value="even">Even</option>
            <option value="odd">Odd</option>
            <option value="mark">Mark</option>
            <option value="space">Space</option>
          </select>
        </div>
        <div class="field">
          <label>DTR</label>
          <select id="dtr">
            <option value="true" selected>ON</option>
            <option value="false">OFF</option>
          </select>
        </div>
        <div class="field">
          <label>RTS</label>
          <select id="rts">
            <option value="true">ON</option>
            <option value="false" selected>OFF</option>
          </select>
        </div>
        <div class="field">
          <label>启用扫码</label>
          <select id="enabled">
            <option value="true" selected>是</option>
            <option value="false">否</option>
          </select>
        </div>
      </div>
      <div class="config-actions">
        <button id="btn-connect" class="btn btn-primary">🔌 连接并启动</button>
        <button id="btn-disconnect" class="btn btn-danger" disabled>⏹ 断开</button>
        <button id="btn-refresh" class="btn btn-outline">🔄 刷新状态</button>
      </div>
      <div id="config-status" class="config-hint">当前配置：<code>COM1 / 115200 / 8N1 / DTR:ON / RTS:OFF</code></div>
    </div>

    <!-- ===== 扫码结果显示 ===== -->
    <div class="scan-area">
      <h2>📟 扫码结果</h2>
      <div id="scan-display" class="scan-display">
        <div class="scan-label">扫描结果</div>
        <div id="scan-text" class="scan-empty">等待扫码数据...</div>
        <div id="scan-time" class="scan-time"></div>
      </div>
      <div id="scan-counter" class="scan-counter">共扫码 <strong>0</strong> 次</div>
      <div class="scan-history">
        <h3>历史记录</h3>
        <div id="history-list" class="scan-history-list"></div>
      </div>
    </div>

    <!-- ===== 调试图表 ===== -->
    <div class="debug-section">
      <div class="debug-panel">
        <h3>📊 串口统计</h3>
        <div class="stat-grid">
          <div class="stat-item">
            <div class="s-label">已接收字节</div>
            <div class="s-value" id="bytes-received">0</div>
          </div>
          <div class="stat-item">
            <div class="s-label">数据块数</div>
            <div class="s-value" id="chunks-received">0</div>
          </div>
          <div class="stat-item">
            <div class="s-label">最后数据时间</div>
            <div class="s-value" id="last-chunk-time" style="font-size:13px;">-</div>
          </div>
          <div class="stat-item">
            <div class="s-label">DTR / RTS</div>
            <div class="s-value" id="modem-signals" style="font-size:16px;">- / -</div>
          </div>
        </div>
        <div style="margin-top:12px;">
          <h3 style="font-size:12px; color:var(--muted); margin:0 0 6px;">DTR/RTS 控制（点击后立即生效）</h3>
          <div class="signal-row">
            <button class="signal-btn" data-dtr="true" data-rts="true">DTR:ON / RTS:ON</button>
            <button class="signal-btn" data-dtr="true" data-rts="false">DTR:ON / RTS:OFF</button>
            <button class="signal-btn" data-dtr="false" data-rts="true">DTR:OFF / RTS:ON</button>
            <button class="signal-btn" data-dtr="false" data-rts="false">DTR:OFF / RTS:OFF</button>
          </div>
        </div>
      </div>
      <div class="debug-panel">
        <h3>🔬 最近数据块（HEX / ASCII）</h3>
        <pre id="recent-chunks">暂无数据</pre>
      </div>
    </div>

    <!-- ===== 原始 API 调试 ===== -->
    <div class="debug-section">
      <div class="debug-panel">
        <h3>📋 扫码状态 (API)</h3>
        <pre id="api-scanner-debug">{}</pre>
      </div>
      <div class="debug-panel">
        <h3>📋 最新扫码 (API)</h3>
        <pre id="api-scanner-latest">{}</pre>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ===== DOM 引用 =====
      const $ = (id) => document.getElementById(id);
      const comPort = $('com-port');
      const baudrate = $('baudrate');
      const dataBits = $('data-bits');
      const stopBits = $('stop-bits');
      const parity = $('parity');
      const dtrSelect = $('dtr');
      const rtsSelect = $('rts');
      const enabled = $('enabled');
      const btnConnect = $('btn-connect');
      const btnDisconnect = $('btn-disconnect');
      const btnRefresh = $('btn-refresh');
      const configStatus = $('config-status');
      const statusBadge = $('status-badge');
      const statusText = $('status-text');
      const scanDisplay = $('scan-display');
      const scanText = $('scan-text');
      const scanTime = $('scan-time');
      const scanCounter = $('scan-counter');
      const historyList = $('history-list');
      const bytesReceived = $('bytes-received');
      const chunksReceived = $('chunks-received');
      const lastChunkTime = $('last-chunk-time');
      const modemSignals = $('modem-signals');
      const recentChunks = $('recent-chunks');
      const apiScannerDebug = $('api-scanner-debug');
      const apiScannerLatest = $('api-scanner-latest');
      const errMsg = $('err-msg');
      const signalBtns = document.querySelectorAll('.signal-btn');

      // ===== 状态 =====
      let scanCount = 0;
      let connected = false;
      let pollTimer = null;
      let lastScanText = '';
      let lastScanAt = null;

      // ===== 工具函数 =====
      function h(str) {
        const el = document.createElement('span');
        el.textContent = str;
        return el.innerHTML;
      }

      function pretty(v) {
        return JSON.stringify(v, null, 2);
      }

      async function api(url, options) {
        const res = await fetch(url, { cache: 'no-store', ...options });
        if (!res.ok) throw new Error(`${url} ${res.status}`);
        return res.json();
      }

      function updateBadge(state, text) {
        statusBadge.className = 'status-badge ' + state;
        statusText.textContent = text;
      }

      function updateConfigHint() {
        const p = parity.value === 'none' ? 'N' : parity.value[0].toUpperCase();
        const d = dtrSelect.value === 'true' ? 'ON' : 'OFF';
        const r = rtsSelect.value === 'true' ? 'ON' : 'OFF';
        configStatus.innerHTML =
          `当前配置：<code>${comPort.value} / ${baudrate.value} / ${dataBits.value}${p}${stopBits.value} / DTR:${d} / RTS:${r}</code>`;
      }

      function addHistory(text, time) {
        const item = document.createElement('div');
        item.className = 'history-item';
        const t = time ? new Date(time).toLocaleTimeString() : new Date().toLocaleTimeString();
        item.innerHTML = `<span class="h-text">${h(text)}</span><span class="h-time">${t}</span>`;
        historyList.prepend(item);
        // 保留最近50条
        while (historyList.children.length > 50) {
          historyList.removeChild(historyList.lastChild);
        }
      }

      function renderScan(payload) {
        apiScannerLatest.textContent = pretty(payload);
        const scan = payload.latestScan;
        if (scan && scan.rawText) {
          scanDisplay.className = 'scan-display has-data';
          scanText.textContent = scan.rawText;
          scanText.className = 'scan-text';
          scanTime.textContent = '扫码时间：' + (scan.scannedAt ? new Date(scan.scannedAt).toLocaleString() : '-');
          // 只在新扫码(文字或时间不同)时才计数
          if (scan.rawText !== lastScanText || scan.scannedAt !== lastScanAt) {
            scanCount++;
            scanCounter.innerHTML = `共扫码 <strong>${scanCount}</strong> 次`;
            addHistory(scan.rawText, scan.scannedAt);
            lastScanText = scan.rawText;
            lastScanAt = scan.scannedAt;
          }
        } else {
          scanDisplay.className = 'scan-display';
          scanText.textContent = connected ? '等待扫码数据...' : '扫码枪未连接';
          scanText.className = 'scan-empty';
          scanTime.textContent = '';
        }
      }

      function renderDebug(payload) {
        apiScannerDebug.textContent = pretty(payload);

        const debug = payload.debug || {};
        const config = payload.currentConfig || {};

        bytesReceived.textContent = (debug.bytesReceived || 0).toLocaleString();
        chunksReceived.textContent = (debug.chunksReceived || 0).toLocaleString();
        lastChunkTime.textContent = debug.lastChunkAt
          ? new Date(debug.lastChunkAt).toLocaleTimeString()
          : '-';

        const dtr = config.dtr !== false ? 'ON' : 'OFF';
        const rts = config.rts !== false ? 'ON' : 'OFF';
        modemSignals.textContent = `${dtr} / ${rts}`;

        // 更新信号按钮高亮
        signalBtns.forEach(btn => {
          const match = String(config.dtr !== false) === btn.dataset.dtr &&
                        String(config.rts !== false) === btn.dataset.rts;
          btn.classList.toggle('active', match);
        });

        // 最近数据块
        const chunks = debug.recentChunks || [];
        if (chunks.length === 0) {
          recentChunks.textContent = '暂无数据';
        } else {
          const lines = chunks.slice().reverse().map(c => {
            const tm = new Date(c.at).toLocaleTimeString();
            return `[${tm}] HEX: ${c.hex}\n         ASC: ${c.textPreview}`;
          });
          recentChunks.textContent = lines.join('\n\n');
        }

        // 连接状态
        connected = payload.connected;
        if (connected) {
          updateBadge('online', '已连接 ' + (config.comPort || ''));
          btnConnect.disabled = true;
          btnDisconnect.disabled = false;
        } else if (payload.currentConfig && payload.currentConfig.enabled) {
          updateBadge('offline', '连接失败');
          btnConnect.disabled = false;
          btnDisconnect.disabled = true;
        } else {
          updateBadge('offline', '未连接');
          btnConnect.disabled = false;
          btnDisconnect.disabled = true;
        }
      }

      async function refreshAll() {
        try {
          const [debugData, latestData] = await Promise.all([
            api('/api/scanner/debug'),
            api('/api/scanner/latest')
          ]);
          errMsg.style.display = 'none';
          renderDebug(debugData);
          renderScan(latestData);
          updateBadge(
            debugData.connected ? 'online' : 'offline',
            debugData.connected ? '已连接' : '未连接'
          );
        } catch (err) {
          const detail = err.message || String(err);
          updateBadge('offline', 'API 请求失败');
          scanText.textContent = '无法连接后端服务';
          scanText.className = 'scan-empty';
          scanTime.textContent = '错误: ' + detail;
          connected = false;
          btnConnect.disabled = false;
          btnDisconnect.disabled = true;
          errMsg.style.display = 'block';
          errMsg.innerHTML = '<strong>请求失败详情:</strong> ' + detail +
            '<br><small>如果使用了系统代理，请将 <code>100.95.*</code> 加入代理例外列表' +
            '<br>或在工控机上直接用 <code>http://localhost:3000/scanner-test.html</code> 打开</small>';
        }
      }

      async function connectScanner() {
        const cfg = {
          comPort: comPort.value,
          baudrate: parseInt(baudrate.value),
          dataBits: parseInt(dataBits.value),
          stopBits: parseFloat(stopBits.value),
          parity: parity.value,
          dtr: dtrSelect.value === 'true',
          rts: rtsSelect.value === 'true',
          enabled: enabled.value === 'true',
          timeoutMs: 5000
        };

        updateBadge('connecting', '连接中...');
        btnConnect.disabled = true;

        try {
          const result = await api('/api/config/scanner', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cfg)
          });

          if (result.success) {
            await refreshAll();
          } else {
            throw new Error(result.message || '配置失败');
          }
        } catch (err) {
          updateBadge('offline', '连接失败: ' + err.message);
          btnConnect.disabled = false;
        }
      }

      async function disconnectScanner() {
        const cfg = {
          comPort: comPort.value,
          baudrate: parseInt(baudrate.value),
          dataBits: parseInt(dataBits.value),
          stopBits: parseFloat(stopBits.value),
          parity: parity.value,
          dtr: dtrSelect.value === 'true',
          rts: rtsSelect.value === 'true',
          enabled: false,
          timeoutMs: 5000
        };

        btnDisconnect.disabled = true;

        try {
          await api('/api/config/scanner', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(cfg)
          });
          await refreshAll();
        } catch (err) {
          updateBadge('offline', '断开失败');
          btnDisconnect.disabled = false;
        }
      }

      async function setLineSignals(dtr, rts) {
        signalBtns.forEach(b => b.disabled = true);
        try {
          await api('/api/scanner/debug/line-signals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ dtr, rts, reconnect: true })
          });
          await refreshAll();
        } catch (err) {
          console.error('line-signal failed', err);
        } finally {
          signalBtns.forEach(b => b.disabled = false);
        }
      }

      // ===== 绑定事件 =====
      [comPort, baudrate, dataBits, stopBits, parity, dtrSelect, rtsSelect].forEach(el => {
        el.addEventListener('change', updateConfigHint);
      });

      btnConnect.addEventListener('click', connectScanner);
      btnDisconnect.addEventListener('click', disconnectScanner);
      btnRefresh.addEventListener('click', refreshAll);

      signalBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          setLineSignals(btn.dataset.dtr === 'true', btn.dataset.rts === 'true');
        });
      });

      // ===== 启动 =====
      updateConfigHint();
      refreshAll();

      // 轮询（1.5秒）
      pollTimer = setInterval(refreshAll, 1500);

      // 页面不可见时停止轮询
      document.addEventListener('visibilitychange', () => {
        if (pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
        }
        if (!document.hidden) {
          refreshAll();
          pollTimer = setInterval(refreshAll, 1500);
        }
      });
    })();
  </script>
</body>
</html>
