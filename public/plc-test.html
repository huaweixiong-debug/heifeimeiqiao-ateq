<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备监控</title>
<script src="/appearance.js"></script>
<link rel="stylesheet" href="/appearance.css">
<style>
  :root{
    --bg:#f3f5f7;
    --panel:#fff;
    --border:#dde1e6;
    --text:#1a1d22;
    --muted:#6b7280;
    --accent:#1d8cc7;
    --shadow:0 1px 4px rgba(0,0,0,.06);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;
  }

  .page{
    width:min(960px, calc(100vw - 24px));
    margin:0 auto;
    padding:18px 0;
    display:grid;
    gap:12px;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
  }

  .header{
    padding:18px 20px 14px;
  }

  .title-links{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:8px;
  }

  .title-link{
    color:var(--muted);
    text-decoration:none;
    font-size:12px;
  }

  .title-link:hover,
  .title-link.active{
    color:var(--accent);
  }

  .notice{
    padding:28px 20px;
  }

  .notice h2{
    margin:0 0 8px;
    font-size:20px;
  }

  .notice p{
    margin:0;
    color:var(--muted);
    line-height:1.7;
  }
</style>
</head>
<body>
  <div class="page">
    <header class="panel header">
      <h1>设备监控</h1>
      <div class="title-links">
        <a class="title-link" href="/index.html">泄漏测试</a>
        <a class="title-link" href="/query.html">数据查询</a>
        <a class="title-link" href="/settings.html">系统设置</a>
        <a class="title-link" href="/comm-config.html">通讯配置</a>
        <a class="title-link active" href="/plc-test.html">设备监控</a>
      </div>
    </header>

    <section class="panel notice">
      <h2>当前项目未启用设备监控模块</h2>
      <p>这个项目只保留 ATEQ 仪器和扫码枪功能，PLC 相关页面与控制项已隐藏。</p>
    </section>
  </div>
</body>
</html>
